[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevdrive"
version = "0.1.0"
description = "Simulation-only concurrent Jev driver runtime"
requires-python = ">=3.12"
dependencies = ["numpy", "typesafe-sdk==0.6.0", "simforge-oss-gym==0.1.0rc61"]

[project.scripts]
jevdrive = "jevdrive.__main__:main"

[tool.setuptools]
packages = ["jevdrive"]
