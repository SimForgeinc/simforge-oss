[project]
name = "simforge-oss-physics"
version = "0.1.0rc61"
description = "Articulated physics profile (articulated-mujoco-v1): MuJoCo CPU and MuJoCo Warp execution of the delivery-robot curb/ramp workload with typed actions, observations, snapshots and scene-state export."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "SimForge" }]
dependencies = [
    "mujoco>=3.11",
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/SimForgeinc/simforge-oss"

[project.optional-dependencies]
# MuJoCo Warp batched backend. Requires an NVIDIA GPU with a CUDA driver for
# device execution; mujoco-warp 3.12 pins mujoco>=3.11 and warp-lang>=1.15.
warp = ["mujoco-warp>=3.12", "warp-lang>=1.15"]
dev = ["pytest==9.1.1"]

[project.scripts]
simforge-oss-physics = "simforge_oss_physics.__main__:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simforge_oss_physics"]

[tool.hatch.build.targets.sdist]
include = ["simforge_oss_physics", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
