[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simforge-qwen-drive"
version = "0.1.0"
description = "SimForge Qwen-Drive-1.0 closed-loop policy endpoint"
readme = { text = "Qwen-Drive-1.0 SimForge adapter", content-type = "text/plain" }
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "msgpack>=1.0",
  "numpy>=1.24",
  "pillow>=10.0",
  "simforge-policy-endpoint==0.1.0",
]

[project.optional-dependencies]
model = [
  "torch>=2.8.0",
  "torchvision>=0.23.0",
  "transformers>=5.14.0,<5.15.0",
  "accelerate>=1.0.0",
  "safetensors>=0.4.5",
  "causal-conv1d>=1.6.2",
  "flash-linear-attention>=0.5.1",
]
quant = ["bitsandbytes>=0.45.0"]

[project.scripts]
simforge-qwen-drive-server = "simforge_qwen_drive.server:main"
simforge-qwen-drive-conformance = "simforge_qwen_drive.conformance:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simforge_qwen_drive"]

[tool.uv.sources]
simforge-policy-endpoint = { path = "../policy-endpoint" }
