# The Rust toolchain every SimForge build uses: the native addon, the WASM
# module, the Python binding, the CPU runner and the renderer.
#
# Pinned because trace bytes must not depend on who built the engine. The core
# routes transcendental math through its own port (simforge-core/src/math), so a
# compiler upgrade should not move a trace, but "should not" is what the
# golden-trace corpus and the native-vs-WASM identity test are for: upgrade this
# pin in its own change, with those two suites green (docs/engineering/engine-semver.md).
# `rust-version` in native/Cargo.toml stays the minimum supported version.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
