[package]
# The package is `simforge` (release archives and the Homebrew formula are
# named after it); the directory keeps its pre-split name until track S
# relocates it.
name = "simforge"
description = "The SimForge command line: package, maps, assets, timeline, render, simulate, env serve, doctor."
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/SimForgeinc/simforge-sdk"
homepage = "https://simforge.ai"
documentation = "https://docs.simforge.ai"
readme = false
rust-version = "1.85"
# A member of the renderer workspace, not of native/: `simforge render` and
# `simforge env serve` link the renderer as a library, and only the renderer
# workspace root carries the vendored-Bevy [patch.crates-io] table and the
# lockfile those builds are pinned by. native/Cargo.toml excludes this
# directory. The SDK split moves everything into one workspace (track S).
workspace = "../../../renderer"

[[bin]]
name = "simforge"
path = "src/main.rs"

[lib]
name = "simforge_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Adapter enumeration for `doctor`: the same wgpu the renderer is built on,
# so the adapter list is the one a render would choose from.
wgpu = { version = "29.0.4", default-features = false, features = ["std", "vulkan", "metal", "dx12"] }
futures-lite = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
fs4 = { version = "1", default-features = false }
sha2 = "0.10"
flate2 = "1"
regex = "1"
# The bundled agent skills (skills/<name>/SKILL.md), embedded at build time.
include_dir = "0.7"
# Decodes the render job's RGB frames (lossless RGBA8 PNG) for the video encoder.
png = "0.18"
# The engine: traces, the render timeline and its sampler.
simforge-core = { path = "../simforge-core" }
# The Python SDK's episode glue (EnvSession, action row, observation layout,
# checkpoints): `env serve` is the `_native` session over a socket.
simforge-bindings-common = { path = "../simforge-bindings-common" }
# Map bundles (lane graph with speed limits, static colliders) for re-simulation.
simforge-compiler = { path = "../simforge-compiler" }
# simforge.scenario-package/v1: the same reader/verifier the hosted exporter's
# Node binding writes with.
simforge-package = { path = "../simforge-package" }
# Authoring (template, sites, instantiate, variation, batch, catalog, locations).
simforge-authoring = { path = "../simforge-authoring" }

# The renderer, in process: `render` runs render_service's job path (the
# same request path the render service serves) and `env serve` its episode
# path. The simforge-render binary stays for the worker image. Headless:
# no `view` (the winit viewport), so the CLI links no windowing, input or
# audio libraries.
simforge-render = { path = "../../../renderer/service", default-features = false }
render-core = { path = "../../../renderer/render-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.dist]
# Explicit: cargo-dist 0.33's global package filter does not select it.
dist = true

[dev-dependencies]
tempfile = "3"
