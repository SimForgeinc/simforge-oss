[package]
name = "simforge-session"
description = "SIMFORGE native sessions: finite Gymnasium-semantics EnvSession, deterministic parallel SessionBatch, policy trajectory execution, and the command-driven live/clip WorldSession with bounded truth subscribers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "simforge_session"

[dependencies]
simforge-core = { path = "../simforge-core" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
rayon = "1.12"
rmp-serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8"
memmap2 = "0.9"
crc32fast = "1"
