[package]
name = "simforge-assets"
description = "Content-addressed asset closures (simforge.actor-assets-closure/v1): fetch by digest, verify, cache, materialize. The library behind `simforge assets pull`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "simforge_assets"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[features]
# The HTTP client. Offline consumers (the renderer resolving what
# `simforge assets pull` materialized) build without it.
default = ["http"]
http = ["dep:ureq"]

[dev-dependencies]
tempfile = "3"
