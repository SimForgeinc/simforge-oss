[package]
name = "simforge-render-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "simforge_render"
crate-type = ["cdylib"]

[dependencies]
simforge-render = { path = "../service" }
render-core = { path = "../render-core" }
serde_json = "1"

[features]
# Device-resident sensor output through the in-process handle path.
gpu-interop = ["simforge-render/gpu-interop", "render-core/gpu-interop"]
