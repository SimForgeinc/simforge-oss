[package]
name = "render-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Bounds the asset files the residency reader holds open (texture_residency.rs).
async-lock = "3"
crossbeam-channel = "0.5"
# `basis-universal` transcodes the map masters' UASTC KTX2 images to GPU formats at load.
# The source map GLBs use specular, anisotropy, clearcoat, and (potentially) transmission
# textures. Bevy gates those texture bindings behind explicit features; omitting them
# silently drops authored PBR inputs.
#
# Headless by default: Bevy's default feature set minus its platform layer
# (winit, x11, wayland, gilrs, clipboard, custom cursor) and audio, so the
# `simforge` CLI and the render service link no windowing, input or audio
# libraries (libwayland, libudev, libasound). The plugin set the headless
# engine runs is unchanged: it always disabled WinitPlugin and AudioPlugin.
# The interactive viewport turns the platform layer back on with the
# `windowing` feature.
bevy = { version = "0.19.1", default-features = false, features = [
  # = Bevy's `default` (2d, 3d, ui, audio) without `default_platform`'s
  # windowing/input backends and without `audio`.
  "default_app",
  "std",
  "multi_threaded",
  "default_font",
  "sysinfo_plugin",
  "2d_bevy_render",
  "3d_bevy_render",
  "ui_api",
  "ui_bevy_render",
  "bevy_ui_widgets",
  "scene",
  "picking",
  "png",
  "jpeg",
  "hdr",
  "ktx2",
  "basis-universal",
  "debug",
  "tonemapping_luts",
  "pbr_light_textures",
  "pbr_specular_textures",
  "pbr_anisotropy_texture",
  "pbr_multi_layer_material_textures",
  "pbr_transmission_textures",
] }
image = "0.25"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ingest-time GPU texture variants (`ktx2_variant`, `simforge-render dev ktx2-gpu-variant`):
# the same KTX2 reader and zstd encoder versions Bevy already locks.
ktx2 = "0.5"
ruzstd = "0.8"
walkdir = "2"

sha2 = "0.10"
# The ground derivative (`derived/ground/ground-mesh.bin`): one decoder and
# query implementation shared with the simulator and the contact gate.
simforge-core = { path = "../../native/crates/simforge-core" }

# Raw wgpu types (query sets for `gpu_diagnostics`); Bevy enables the
# backends. `gpu-interop` (Linux) adds the Vulkan HAL for raw handles to
# exportable output memory and semaphores (see src/gpu_interop.rs). `ash`
# must track wgpu-hal's 0.38.
wgpu = { version = "29.0.4", default-features = false }
ash = { version = "0.38", default-features = false, optional = true }
libc = { version = "0.2", optional = true }

# Sky plates: the pinned sky closure materialized by `simforge assets pull`
# (offline lookup only, so no HTTP client; src/sky_pass.rs).
simforge-assets = { path = "../../native/crates/simforge-assets", default-features = false }

[features]
default = ["pcss"]
# The windowed platform layer (winit + x11/wayland, gilrs, clipboard, audio)
# for the interactive viewport. The headless engine disables WinitPlugin and
# AudioPlugin when they are compiled in, so this feature must be on exactly
# when Bevy has them: every crate that enables Bevy's platform layer enables
# it (the viewport, through simforge-render's `view`).
windowing = ["bevy/bevy_winit", "bevy/x11", "bevy/wayland", "bevy/bevy_gilrs", "bevy/bevy_clipboard", "bevy/custom_cursor", "bevy/audio"]
# Chrome-trace CPU spans of every Bevy system (profiling builds only).
trace-chrome = ["bevy/trace_chrome"]
# PCSS soft shadows (lighting ladder rung 4)
pcss = ["bevy/experimental_pbr_pcss"]
# Solari raytraced GI (rung 5) — optional RT-hardware quality tier
solari = ["bevy/bevy_solari"]
# Exportable Vulkan/CUDA output path (`render_core::gpu_interop`). Linux
# only; enabling it for another target is a compile error (src/lib.rs).
gpu-interop = ["bevy/raw_vulkan_init", "wgpu/vulkan", "dep:ash", "dep:libc"]

[dev-dependencies]
libc = "0.2"
# Walker grounding test (tests/walker_grounding.rs) poses skins straight from
# glTF, independent of Bevy; same crate version bevy_gltf already locks.
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
# The CARLA model packs the tests render are content-addressed closures
# fetched by digest (src/test_packs.rs); their bytes are not in git.
simforge-assets = { path = "../../native/crates/simforge-assets", features = ["http"] }
