[package]
name = "sensors"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
render-core = { path = "../render-core" }
# Headless: Bevy's platform layer comes only through render-core's `windowing`.
bevy = { version = "0.19.1", default-features = false, features = ["png", "hdr", "ktx2", "debug", "tonemapping_luts"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# Pinned with the rest of the renderer; `gpu_rays` drives ray queries directly.
wgpu = { version = "29.0.4", default-features = false }

