[workspace]
resolver = "2"
members = ["render-core", "sensors", "service", "ffi", "viewport"]
exclude = ["vendor/bevy_gltf", "vendor/bevy_pbr", "vendor/bevy_mesh", "vendor/bevy_render"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Vendored Bevy 0.19.1 crates, each carrying a patch intended for upstream
# (headers in vendor/*/src/lib.rs list the deviations):
# - bevy_gltf: native KHR_texture_basisu (bevyengine/bevy#19104), per-slot
#   KHR_texture_transform and TEXCOORD_2/3 (bevyengine/bevy#15310), image
#   dedup across textures.
# - bevy_mesh / bevy_pbr: UV channels 2 and 3 and per-slot UV transforms on
#   StandardMaterial (the material side of bevy#15310).
# - bevy_pbr: a view's generated environment probe (the atmosphere's
#   per-camera IBL) is downsampled/filtered in that view's schedule right
#   after it is written, not one frame late (vendor/bevy_pbr-view-probe.patch;
#   removes the only previous-pose dependence of a pinned capture); and the
#   shared atmosphere buffer is written when several views carry an
#   atmosphere (upstream wrote it only for exactly one, so a rig that had
#   two cameras from the first frame failed validation in SSR).
# - bevy_render: command encoders are finished in parallel at submission, in
#   recording order (vendor/bevy_render.patch; output-identical, it only
#   moves wgpu-core's per-encoder HAL recording off the render thread);
#   and draw order is a function of the scene, not of the run: sorted phases
#   break equal sort keys by main entity, and binned phases keep each bin in
#   entity order (without this, blended items at equal distance composited
#   differently between runs and two golden record runs disagreed).
# Every other Bevy crate stays pinned to crates.io 0.19.1.
[patch.crates-io]
bevy_gltf = { path = "vendor/bevy_gltf" }
bevy_mesh = { path = "vendor/bevy_mesh" }
bevy_pbr = { path = "vendor/bevy_pbr" }
bevy_render = { path = "vendor/bevy_render" }

[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1

# Optimised build with line tables for Nsight Systems / perf sampling and a
# faster link than `release` (codegen-units=1). Not a shipping profile.
[profile.profiling]
inherits = "release"
codegen-units = 16
debug = "line-tables-only"
