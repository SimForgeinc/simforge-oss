[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "simforge-oss-splat"
version = "0.1.0rc65"
description = "SimForge NuRec splat backend: V5 render-service host (shm) and in-process leased CUDA tensor sensor path over 3DGRUT"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "SimForge" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: POSIX :: Linux",
]
# Ordinary Python dependencies only. The CUDA tier is an explicit external prerequisite
# resolved at start by `simforge_splat.prerequisites` (actionable CapabilityError otherwise):
#   * PyTorch with CUDA matching the driver (install per pytorch.org for the target CUDA);
#   * 3DGRUT checkout (nv-tlabs/3dgrut, Apache-2.0) with its tracer plugin compiled for the GPU,
#     located through $THREEDGRUT_ROOT or an importable `threedgrut` package; it provides
#     `threedgut_tracer`, `ncore` and the hydra configs;
#   * NVIDIA Kaolin built for that torch/CUDA (kaolin.readthedocs.io). Deliberately NOT declared:
#     the PyPI project named "kaolin" is unrelated and must not be pulled in by a resolver;
#   * NuRec .usdz packages, imported scene bundles, GLB catalog roots and the optional ego-hood
#     overlay directory: data, never vendored (dataset licence in LICENSES.md).
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.0",
    "msgpack>=1.0",
    "PyYAML>=6.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# torch is pulled from the CUDA index, not PyPI default; this extra only pins the floor.
torch = ["torch>=2.4"]
dev = ["pytest>=8"]

[project.scripts]
# `simforge-oss-splat capabilities [--no-probe]`, `... job --params P --out-dir D [--resume C]`, `... service ...`
simforge-oss-splat = "simforge_splat.__main__:main"

[project.urls]
Repository = "https://github.com/SimForgeinc/simforge-oss"

[tool.hatch.build.targets.wheel]
packages = ["simforge_splat"]

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "simforge_splat", "splat_client_check.py", "splat_determinism.py", "splat_tensor_check.py", "tests", "../LICENSES.md", "../PROVENANCE.json"]

[tool.hatch.build.force-include]
"../LICENSES.md" = "simforge_splat/LICENSES.md"
"../PROVENANCE.json" = "simforge_splat/PROVENANCE.json"
