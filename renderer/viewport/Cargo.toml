[package]
name = "simforge-render-view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "simforge_render_view"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
bevy = { version = "0.19.1", default-features = true, features = ["png", "jpeg", "hdr", "ktx2", "basis-universal", "tonemapping_luts", "pbr_light_textures", "pbr_specular_textures", "pbr_anisotropy_texture", "pbr_multi_layer_material_textures", "pbr_transmission_textures"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Not used directly: this is how the `counters` feature is turned on for the
# wgpu that Bevy builds. Cargo unions features across the graph, so the
# allocation counters the census reads (`HalCounters::buffer_memory`,
# `texture_memory`, `memory_allocations`) compile to real atomics instead of
# the no-op `InternalCounter` that always reads 0. Without it the census
# reports zeroes that look like a measurement.
wgpu = { version = "29", default-features = false, features = ["counters"] }
