[package]
name = "service"
version.workspace = true
edition.workspace = true

[[bin]]
name = "native-render-service"
path = "src/bin/native-render-service.rs"

[dependencies]
render-core = { path = "../render-core" }
sensors = { path = "../sensors" }
bevy = { version = "0.19.1", default-features = false }
anyhow = "1"
crc32fast = "1"
sha2 = "0.10"
image = "0.25"
memmap2 = "0.9"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hardware-ray lidar: the render device's raw wgpu handles (Bevy enables the backends).
wgpu = { version = "29.0.4", default-features = false }

# statvfs for the sensor-scene cache's free-space check.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Named-pipe endpoint (`endpoint.rs`): CreateNamedPipeW with a current-user
# DACL, token SID lookup. Version tracks the one Bevy's tree already locks.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[features]
# Device-resident sensor output (`open_device_stream` & co.); off by default.
# Linux-only (opaque-fd Vulkan/CUDA export): render-core rejects the feature
# at compile time on other targets.
gpu-interop = ["render-core/gpu-interop"]
