[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "simforge-oss-native-renderer"
version = "0.1.0rc63"
description = "SimForge resident renderer client, embedded C ABI adapter, and leased CUDA output transport"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["msgpack>=1.1", "numpy>=1.26"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/SimForgeinc/simforge-oss"

[tool.hatch.build.targets.wheel]
packages = ["simforge_native"]

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "simforge_native"]
