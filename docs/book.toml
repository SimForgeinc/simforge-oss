[book]
title = "SimForge SDK"
description = "The simforge CLI, the deterministic renderer and the Gymnasium client"
authors = ["SimForge"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
site-url = "/"
git-repository-url = "https://github.com/SimForgeinc/simforge-sdk"
edit-url-template = "https://github.com/SimForgeinc/simforge-sdk/edit/main/docs/{path}"
additional-js = ["theme/versions.js"]
no-section-label = true

[output.html.search]
limit-results = 20
