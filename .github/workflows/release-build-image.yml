name: release-build-image
# Builds ghcr.io/simforgeinc/simforge-release-build:<date> from
# docker/release-build.Dockerfile. A change to the Dockerfile or to
# rust-toolchain.toml must also bump the tag in dist-workspace.toml and the
# release*.yml/supply-chain.yml `container:` lines (one date string; the
# release agent does it in the same PR). The image is public: public-repo
# workflows pull it without credentials.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (the date string the workflows reference, e.g. 2026-09-24)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: simforge-build
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/simforgeinc/simforge-release-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse to overwrite an existing tag
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "$IMAGE:${{ inputs.tag }} exists; images are immutable, pick a new tag" >&2; exit 1
          fi
      - id: push
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          docker buildx build --push -f docker/release-build.Dockerfile \
            --build-arg RUST_TOOLCHAIN="$toolchain" \
            --provenance=false --metadata-file metadata.json \
            -t "$IMAGE:${{ inputs.tag }}" .
          echo "digest=$(jq -r '."containerimage.digest"' metadata.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
