name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install OpenSCENARIO schema validator
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
      - run: pnpm install --frozen-lockfile
      - name: Smoke Meshy generation contract
        run: pnpm meshy:smoke
      - name: Smoke Meshy API authentication when configured
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: pnpm meshy:smoke:live
      - run: pnpm verify:naming
      - run: pnpm verify:origins
      - run: pnpm typecheck
      - run: pnpm test:release
      - name: Test the repository scripts
        # Nothing referenced scripts/__tests__ before this step: five test
        # files sat in the tree looking like coverage and never executed.
        # Two of them import @simforge-oss/map-pipeline's build output, so it
        # is built first; the rest need only sources.
        #
        # The release pin is the load-bearing one: it names the binding ABI a
        # published runtime archive satisfies, and a pin that has drifted from
        # packages/native-runtime/src/shared.ts is the stale-artifact defect
        # the verified install path exists to prevent.
        run: |
          pnpm --filter @simforge-oss/map-pipeline build
          node --test scripts/__tests__/*.test.mjs
      - run: pnpm test:integration
      - run: pnpm test:portable
      - run: pnpm release:manifest
      - run: pnpm release:verify-artifacts
      - run: pnpm release:smoke-packages

  carla-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenSCENARIO schema validator
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
      - name: Test and smoke-install public CARLA adapter
        run: |
          python -m pip install "build==1.3.0" "./adapters/carla-exec[dev]"
          python -m pytest adapters/carla-exec/tests -q
          python -m build adapters/carla-exec
          python -m venv /tmp/simforge-carla-smoke
          /tmp/simforge-carla-smoke/bin/python -m pip install adapters/carla-exec/dist/*.whl
          /tmp/simforge-carla-smoke/bin/simforge-oss-carla-exec --help
