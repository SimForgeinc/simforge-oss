name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install OpenSCENARIO schema validator
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:naming
      - run: pnpm verify:origins
      - run: pnpm verify:no-silent-fallbacks
      - run: pnpm typecheck
      - name: scenarioVersion bump rule (packages/scenario/src/upgrade/chain.ts)
        # A non-additive document schema change or a changed absent-field
        # meaning needs a scenarioVersion bump with TS and Rust upgraders;
        # additive changes need the refreshed scenario-contract.lock.json.
        run: pnpm scenario:contract:check --base "origin/${{ github.base_ref || 'main' }}"
      - run: pnpm test:release
      - run: pnpm test:bench
      - name: Test the repository scripts
        # Nothing referenced scripts/__tests__ before this step: five test
        # files sat in the tree looking like coverage and never executed.
        # Two of them import @simforge-oss/map-pipeline's build output, so it
        # is built first; the rest need only sources.
        #
        # The release pin is the load-bearing one: it names the binding ABI a
        # published runtime archive satisfies, and a pin that has drifted from
        # packages/native-runtime/src/shared.ts is the stale-artifact defect
        # the verified install path exists to prevent.
        run: |
          pnpm --filter @simforge-oss/map-pipeline build
          node --test scripts/__tests__/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SUMO derivative smoke
        # Installs the digest-pinned SUMO 1.27.1 toolchain, then builds the
        # committed OpenDRIVE fixtures twice through every structural gate
        # (byte-identical output required) and the map-pipeline SUMO tests.
        run: |
          pnpm maps:sumo:toolchain --root "$RUNNER_TEMP/sumo-1.27.1"
          export SIMFORGE_SUMO_TOOLCHAIN="$RUNNER_TEMP/sumo-1.27.1"
          pnpm maps:sumo:smoke
          pnpm --filter @simforge-oss/map-pipeline exec vitest run test/sumo-network.test.ts
      - run: pnpm test:integration
      - run: pnpm test:portable
      - run: pnpm release:manifest
      - run: pnpm release:verify-artifacts
      - run: pnpm release:smoke-packages

  determinism:
    # Engine semantics lock (docs/engineering/engine-semver.md): the golden-trace
    # corpus under the ENGINE_SEM_VER rule, and native (N-API) vs WASM byte
    # identity. Builds both runtime artifacts with the pinned toolchain.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: determinism-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'native/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: ENGINE_SEM_VER rule (golden digests may only change with a bump)
        run: node scripts/determinism/check-engine-semver.mjs --base "origin/${{ github.base_ref || 'main' }}"
      - name: Build the N-API addon and the WASM module
        env:
          CARGO_TARGET_DIR: native/target
          SIMFORGE_SOURCE_REVISION: ${{ github.sha }}
        run: |
          pnpm --filter @simforge-oss/native-runtime run build:node
          pnpm --filter @simforge-oss/native-runtime run build:wasm
      - name: Golden-trace corpus
        run: pnpm --filter @simforge-oss/cli exec vitest run src/__tests__/golden-traces.test.ts
      - name: Native vs WASM trace identity
        run: pnpm --filter @simforge-oss/native-runtime exec vitest run src/__tests__/build-agreement.test.ts src/__tests__/trace-identity.test.ts
      - name: Canonical JSON conformance (TS and Rust)
        run: |
          pnpm --filter @simforge-oss/scenario exec vitest run src/__tests__/canonical-json.test.ts
          cargo test --manifest-path native/Cargo.toml -p simforge-core --test canonical_json_vectors
        env:
          CARGO_TARGET_DIR: native/target
      - name: Archive corpus (fixtures/archive-corpus/README.md)
        # Artifacts from every past release still load, upgrade in memory,
        # keep their identity and replay the same motion through a CPU-built
        # render timeline. Append-only; adding to it is a release step.
        run: |
          pnpm archive-corpus:verify
          cargo test --manifest-path native/Cargo.toml -p simforge-core --test archive_corpus
          pnpm --filter @simforge-oss/scenario exec vitest run src/__tests__/archive-corpus.test.ts
        env:
          CARGO_TARGET_DIR: native/target
      - name: OpenSCENARIO conformance (docs/engineering/openscenario-conformance.md)
        # Primary suite: SimForge vs the ASAM-derived oracle and the storyboard
        # protocol properties (hand-written probes are esmini evidence only).
        # Needs no third-party simulator. The pinned esmini 3.6.0 then adds the
        # cross-check and the trajectory-replay round trip; if it cannot be
        # fetched the script reports those parts as skipped.
        run: |
          pnpm --filter @simforge-oss/engine exec vitest run src/__tests__/storyboard-protocol.test.ts
          pnpm --filter @simforge-oss/cli exec vitest run src/__tests__/osc-conformance.test.ts
          node packages/openscenario/scripts-esmini/fetch-pinned-esmini.mjs || echo "::warning::esmini unavailable; conformance cross-check skipped"
          pnpm osc-conformance:verify
      - name: Cross-renderer pose parity (hook; runs once the WS-B comparator is configured)
        run: node scripts/determinism/renderer-parity.mjs

  studio-style:
    # StyleX discipline for Studio (docs/engineering/studio-style-guide.md):
    # per-file literal budgets that only go down, and the StyleX lint. The
    # lint toolchain installs into scripts/style/eslint on its own lockfile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm style:ratchet --check
      - run: pnpm lint:style
      - run: node --test scripts/__tests__/style-ratchet.test.mjs

  carla-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenSCENARIO schema validator
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
      - name: Test and smoke-install public CARLA adapter
        run: |
          python -m pip install "build==1.3.0" "./adapters/carla-exec[dev]"
          python -m pytest adapters/carla-exec/tests -q
          python -m build adapters/carla-exec
          python -m venv /tmp/simforge-carla-smoke
          /tmp/simforge-carla-smoke/bin/python -m pip install adapters/carla-exec/dist/*.whl
          /tmp/simforge-carla-smoke/bin/simforge-oss-carla-exec --help
