name: docs
# mdBook site for docs.simforge.ai (GitHub Pages, deployed by Actions).
# Deployed on main (the /dev/ tree), on dispatch, and by promote.yml when a
# release goes stable (the root tree). PRs are checked by the merger's local
# SDK gate (scripts/release/check.sh docs), not here: no PR ever runs on the
# self-hosted runner.
#
# Custom domain: Settings -> Pages -> docs.simforge.ai, with the DNS record
#   docs.simforge.ai. CNAME simforgeinc.github.io.
# (Actions-deployed Pages ignore a CNAME file; the domain is a repo setting.)
on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: true
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

env:
  MDBOOK_VERSION: v0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    runs-on: simforge-build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install mdBook (pinned, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          archive="mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -LsSf -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/$archive"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build the versioned site
        run: scripts/docs/build-site.sh site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push' || inputs.deploy
    runs-on: simforge-build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
