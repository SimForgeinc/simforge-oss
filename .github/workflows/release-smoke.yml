name: release-smoke
# dist post-announce job: installs every published artifact of the (still
# prerelease) release and runs it, then attaches smoke-report.json to the
# release. promote.yml refuses a release whose report is missing or not all
# "pass". The GPU smoke on real NVIDIA hardware is the postmerge agent's
# gpu-smoke-report.json (.claude/agents/release.md).
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to smoke again (for example v0.2.0-rc.0)
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || fromJson(inputs.plan).announcement_tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        check: [verify, installer, tarball-arm64, container, render, wheel]
    name: smoke (${{ matrix.check }})
    runs-on: simforge-build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Run
        shell: bash
        run: |
          set -o pipefail
          scripts/release/smoke.sh "${{ matrix.check }}" "$TAG" | tee "smoke-${{ matrix.check }}.json"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.check }}
          path: smoke-${{ matrix.check }}.json

  hosted:
    # The macOS/Windows artifacts can only run on macOS/Windows: the public
    # repo's free GitHub-hosted runners (the release-build exception).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, runner: macos-14 }
          - { name: windows, runner: windows-2022 }
    name: smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Native install + wheel
        shell: bash
        run: |
          set -o pipefail
          { scripts/release/smoke.sh native "$TAG" && PYTHON=python scripts/release/smoke.sh wheel "$TAG"; } | tee "smoke-${{ matrix.name }}.json"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.name }}
          path: smoke-${{ matrix.name }}.json

  report:
    needs: [linux, hosted]
    if: always()
    runs-on: simforge-build
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: smoke-*
          merge-multiple: true
      - name: Attach smoke-report.json to the release
        shell: bash
        run: |
          set -euo pipefail
          expected='["verify","installer","tarball-arm64","container","render","wheel-Linux","native-Darwin","wheel-Darwin","native-Windows","wheel-Windows"]'
          cat smoke-*.json | python3 -c '
          import json, sys, datetime
          rows = [json.loads(l) for l in sys.stdin if l.strip().startswith("{")]
          checks = {r["check"]: r for r in rows}
          expected = json.loads(sys.argv[1])
          missing = [c for c in expected if c not in checks]
          ok = not missing and all(r["status"] == "pass" for r in checks.values())
          print(json.dumps({"tag": sys.argv[2], "at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                            "run": sys.argv[3], "pass": ok, "missing": missing, "checks": checks}, indent=2))
          ' "$expected" "$TAG" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > smoke-report.json
          cat smoke-report.json
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber smoke-report.json
          python3 -c 'import json,sys; sys.exit(0 if json.load(open("smoke-report.json"))["pass"] else 1)'
