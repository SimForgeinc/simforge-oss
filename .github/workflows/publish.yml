name: Publish immutable SimForge stack

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install OpenSCENARIO schema validator
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:release
      - run: pnpm test:integration
      - run: pnpm test:portable
      - run: pnpm release:manifest
      - run: pnpm release:verify-artifacts
      - run: pnpm release:smoke-packages
      - name: Verify tag and publish with npm provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('config/simforge-oss-stack.json'));if(process.env.GITHUB_REF_NAME!=='v'+c.stackVersion)throw new Error('tag must equal v'+c.stackVersion)"
          pnpm --filter "./packages/*" publish --recursive --access public --provenance --no-git-checks

  publish-python:
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release identity of every registered Python package
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          config = json.loads(pathlib.Path("config/simforge-oss-stack.json").read_text())
          expected = "v" + config["stackVersion"]
          assert os.environ["GITHUB_REF_NAME"] == expected, f"tag must equal {expected}"
          python_version = config["stackVersion"].replace("-rc.", "rc")
          entries = config["pythonPackages"]
          assert entries, "stack config registers no Python packages"
          for entry in entries:
              project = pathlib.Path(entry["path"], "pyproject.toml").read_text()
              name = re.search(r'^name = "([^"]+)"', project, re.MULTILINE).group(1)
              version = re.search(r'^version = "([^"]+)"', project, re.MULTILINE).group(1)
              assert name == entry["name"], f'{entry["path"]} is {name}, registered as {entry["name"]}'
              assert version == entry["version"] == python_version, f'{name} is {version}, stack is {python_version}'
          PY
      - name: Build and smoke every registered Python package
        run: |
          python -m pip install "build==1.3.0"
          mkdir -p artifacts/pypi
          python - <<'PY'
          import json, pathlib, subprocess, sys, venv
          config = json.loads(pathlib.Path("config/simforge-oss-stack.json").read_text())
          out = pathlib.Path("artifacts/pypi").resolve()
          for entry in config["pythonPackages"]:
              subprocess.run([sys.executable, "-m", "build", "--outdir", str(out), entry["path"]], check=True)
          smoke = pathlib.Path("/tmp/simforge-oss-pypi-smoke")
          venv.create(smoke, with_pip=True)
          pip = smoke / "bin" / "pip"
          wheels = sorted(out.glob("*.whl"))
          subprocess.run([str(pip), "install", "--no-deps", *map(str, wheels)], check=True)
          for entry in config["pythonPackages"]:
              installed = subprocess.run(
                  [str(smoke / "bin" / "python"), "-c", f'import importlib.metadata as m; print(m.version("{entry["name"]}"))'],
                  check=True, capture_output=True, text=True,
              ).stdout.strip()
              assert installed == entry["version"], f'{entry["name"]} wheel reports {installed}, registered {entry["version"]}'
          PY
      - name: Publish immutable PyPI artifacts with provenance
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artifacts/pypi/
          attestations: true
