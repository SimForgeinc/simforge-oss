name: release-sign
# dist publish job: runs after `host` has uploaded every asset to the (still
# prerelease) GitHub release. Signs each asset keyless with Sigstore (Fulcio
# certificate bound to this workflow at this tag, logged in Rekor), uploads
# <asset>.sigstore.json bundles, and attests build provenance for the global
# assets (per-target archives were attested while they were built).
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  sign:
    runs-on: simforge-build
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Download the release assets
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
      - name: Sign every asset (Sigstore keyless)
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          for f in *; do
            # The container job signs its own assets (it runs in parallel).
            case "$f" in *.sigstore.json|container-image.json|simforge-image-*) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
          done
          ls *.sigstore.json | wc -l
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            assets/*.sh
            assets/*.ps1
            assets/*.rb
            assets/simforge-[0-9]*.cdx.json
            assets/simforge-oss-gym-*.cdx.json
            assets/sha256.sum
            assets/source.tar.gz
      - name: Upload the signature bundles
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber assets/*.sigstore.json
