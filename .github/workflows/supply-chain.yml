name: supply-chain
# Licence/advisory/ban/source policy, third-party notices and asset
# attributions, and the release configuration, on every change. Runs on the
# self-hosted runner, so pull requests run only when they come from this
# repository (forks: a maintainer re-pushes the branch here).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * *"   # new RustSec advisories against main, daily

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  DIST_VERSION: v0.33.0
  DIST_SHA256: 4b3f0a5f0ebbdb798f6db649d01b32ba1518376b6f7a0502b7d92b75cc2c8293

jobs:
  policy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: simforge-build
    container: ghcr.io/simforgeinc/simforge-release-build:2026-09-24
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: cargo deny (licences, advisories, bans, sources)
        run: cargo deny --locked --workspace check
      - name: THIRD_PARTY_NOTICES.md and asset attributions are current
        run: scripts/release/notices.sh --check
      - name: Release workflow matches dist-workspace.toml
        shell: bash
        run: |
          set -euo pipefail
          archive=cargo-dist-x86_64-unknown-linux-gnu.tar.xz
          curl --proto '=https' --tlsv1.2 -LsSf -o "/tmp/$archive" \
            "https://github.com/axodotdev/cargo-dist/releases/download/${DIST_VERSION}/$archive"
          echo "${DIST_SHA256}  /tmp/$archive" | sha256sum -c -
          tar -xJf "/tmp/$archive" -C /tmp
          /tmp/cargo-dist-x86_64-unknown-linux-gnu/dist generate --check
          /tmp/cargo-dist-x86_64-unknown-linux-gnu/dist plan --output-format=json > /dev/null
