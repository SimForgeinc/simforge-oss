name: native-golden

# WSB6: native renderer determinism gate.
#
# Goldens render on Mesa lavapipe, the adapter of record (the CPU Vulkan
# driver): NVIDIA drivers are not run-to-run byte-stable for this renderer
# (1 LSB in a few pixels between identical runs), lavapipe is, and pass
# hashes are compared exactly. The table is keyed by lavapipe build + CPU
# model (qualification/golden-harness/lib/fingerprint.mjs), so the job runs on
# the host the goldens were recorded on (the 5080 box's CPU); no GPU is used.
#
# Runner (one-time, on that host): a self-hosted runner labelled
# gpu-rtx5080, Linux, X64, with mesa-vulkan-drivers and vulkan-tools
# installed and the map corpora at the repo variables below.
#
# Until the runner is registered this workflow shows as "queued"; the same
# steps run locally via qualification/golden-harness/ci-local.sh.

on:
  push:
    branches: [main]
    paths:
      - 'renderer/**'
      - 'qualification/golden-harness/**'
      - '.github/workflows/native-golden.yml'
  pull_request:
    paths:
      - 'renderer/**'
      - 'qualification/golden-harness/**'
  workflow_dispatch: {}

concurrency:
  # One golden host: serialize runs.
  group: native-golden
  cancel-in-progress: false

jobs:
  golden-suite:
    runs-on: [self-hosted, Linux, X64, gpu-rtx5080]
    # Lavapipe renders on the CPU: the five scenes verify in about 40 min.
    timeout-minutes: 120
    env:
      # Map corpus roots (each holds the map's master.gltf).
      SIMFORGE_CORPUS_RICHMOND: ${{ vars.SIMFORGE_CORPUS_RICHMOND }}
      SIMFORGE_CORPUS_YALE: ${{ vars.SIMFORGE_CORPUS_YALE }}
      SIMFORGE_SKY_ASSETS: ${{ vars.SIMFORGE_SKY_ASSETS }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            renderer/target
          key: native-golden-${{ runner.os }}-${{ hashFiles('renderer/Cargo.lock') }}

      - name: Check the adapter of record (lavapipe)
        run: VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json vulkaninfo --summary | grep -q llvmpipe

      - name: Build native renderer
        run: cargo build --release -p simforge-render --manifest-path renderer/Cargo.toml

      - name: Install JS dependencies and the timeline wasm (the parity gate runs the CLI from source)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @simforge-oss/native-runtime build:wasm

      - name: Plan (scene definitions, jobs, corpus availability)
        run: node qualification/golden-harness/golden.mjs plan all

      - name: Verify goldens (exact pass hashes, ID pass, timeline parity)
        run: node qualification/golden-harness/golden.mjs verify all

      - name: Upload verify artifacts (manifests + frames, always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-verify-artifacts
          path: artifacts/golden-harness/
          retention-days: 14
          if-no-files-found: ignore
