name: promote
# Prerelease -> stable. Flips the GitHub release to latest, tags the image
# :X.Y and :latest, publishes the wheels to PyPI (trusted publishing: this
# workflow + the `pypi` environment are the registered publisher), commits the
# Homebrew formula to SimForgeinc/homebrew-tap, and deploys the docs.
#
#   v0.2.x-v0.4.x: the user runs this by hand (workflow_dispatch); the job waits
#                  in the `stable-approval` environment (required reviewer: the user).
#   v0.5.0 on:     the hourly schedule promotes a release 48 h after it was
#                  published if the smoke, the GPU smoke and the issue tracker
#                  are green (scripts/release/promote-eligibility.py).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag to promote (vX.Y.Z; must be a green prerelease)
        required: true
        type: string
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eligibility:
    runs-on: simforge-build
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      tag: ${{ steps.check.outputs.tag }}
      environment: ${{ steps.check.outputs.environment }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            python3 scripts/release/promote-eligibility.py --tag "${{ inputs.tag }}" --event "${{ github.event_name }}"
          else
            python3 scripts/release/promote-eligibility.py --scan --event "${{ github.event_name }}"
          fi
      - name: Refuse a manual promotion that is not eligible
        if: github.event_name == 'workflow_dispatch' && steps.check.outputs.eligible != 'true'
        run: exit 1

  verify:
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: simforge-build
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Signatures, checksums and provenance of every asset and the image
        run: scripts/release/verify-release.sh "${{ needs.eligibility.outputs.tag }}"

  stable:
    needs: [eligibility, verify]
    runs-on: simforge-build
    environment: ${{ needs.eligibility.outputs.environment }}
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.eligibility.outputs.tag }}
      IMAGE: ghcr.io/simforgeinc/simforge
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags :X.Y and :latest (same digest, so the signature holds)
        shell: bash
        run: |
          set -euo pipefail
          digest="$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p container-image.json -O - | jq -r .digest)"
          version="${TAG#v}"
          docker buildx imagetools create -t "$IMAGE:${version%.*}" -t "$IMAGE:latest" "$IMAGE@$digest"
      - name: Mark the GitHub release stable and latest
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest

  homebrew:
    needs: [eligibility, stable]
    runs-on: simforge-build
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.eligibility.outputs.tag }}
    steps:
      - name: Commit the formula to SimForgeinc/homebrew-tap
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_KEY" ]] || { echo "HOMEBREW_TAP_DEPLOY_KEY is not set" >&2; exit 1; }
          keyfile="$(mktemp)"; trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keyfile"; chmod 600 "$keyfile"
          export GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:SimForgeinc/homebrew-tap.git tap
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p simforge.rb -O tap/Formula/simforge.rb --clobber
          cd tap
          git config user.name "simforge-release"
          git config user.email "release@simforge.ai"
          git add Formula/simforge.rb
          git diff --cached --quiet && { echo "formula already current"; exit 0; }
          git commit -m "simforge ${TAG#v}"
          git push origin HEAD:main

  pypi:
    needs: [eligibility, stable]
    runs-on: simforge-build
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.eligibility.outputs.tag }}
    steps:
      - name: Wheels and sdist from the release (the signed, smoked bytes)
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist -p '*.whl' -p 'simforge_oss_gym-*.tar.gz'
          ls -la dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  docs:
    needs: [eligibility, stable]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      deploy: true
