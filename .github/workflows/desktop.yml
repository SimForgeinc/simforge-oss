name: SimForge Studio desktop

# Builds the SimForge Studio installers on native runners: Windows x64 NSIS,
# macOS arm64 and x64 DMG/ZIP, Linux x64 AppImage/deb. Each leg builds the
# whole native payload for its own target (N-API addon, simforge-runner, the
# Bevy render service and FFI library, sky plates), installs this platform's
# optional native npm packages (@napi-rs/keyring-*, @img/sharp-*) through a
# native pnpm install, fetches the pinned encoders and actor closure, stages
# and packages; nothing is cross-built or inferred from another platform, and
# desktop/stage.mjs, desktop/after-pack.mjs and desktop/verify-package.mjs
# each refuse a payload holding native code or per-target packages of any
# other platform. Runs only on manual dispatch or explicitly named desktop CI
# candidate branches. Artifacts are uploaded to the workflow run; this workflow
# never publishes a release or deploys a service.
#
# Signing is real or absent. Windows artifacts are signed only when
# WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD hold a code-signing certificate; macOS
# artifacts are signed only when MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD hold a
# Developer ID Application identity, and notarized only when APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are present as well. None of
# these secrets exist in the repository today, so every leg produces unsigned
# artifacts and names them so; the unsigned macOS app is ad-hoc signed
# (identity "-", no certificate, no Gatekeeper trust) because electron-builder
# 26 has no ad-hoc fallback and an unsigned bundle is killed at launch on
# Apple silicon. With the secrets, forceCodeSigning makes an unsigned result
# a build failure instead of a quiet fallback.

on:
  workflow_dispatch:
    inputs:
      cloud_origin:
        description: "Cloud service for this installer; preview qualification stays on staging"
        type: choice
        options: ["https://staging.simforge.ai", "https://simforge.ai"]
        default: "https://staging.simforge.ai"
  push:
    branches: ["ci/unified-desktop/**"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            targets: --win --x64
            triple: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-14
            targets: --mac --arm64
            triple: aarch64-apple-darwin
          - name: macos-x64
            # macos-13 was retired on 2025-12-04; macos-15-intel is the remaining x86_64 image.
            os: macos-15-intel
            targets: --mac --x64
            triple: x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-24.04
            targets: --linux --x64
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify dependency placement and signed-payload integrity
        run: node --test desktop/stage-dependencies.test.mjs desktop/stage-manifest.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }},wasm32-unknown-unknown
      - name: Install the pinned WASM build tool
        run: cargo install wasm-pack --version 0.13.1 --locked
        working-directory: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sky conversion build dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 pillow==11.3.0
        working-directory: .
      - name: Linux build dependencies (Vulkan/X11/ALSA headers for the render service)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev libx11-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev pkg-config
        working-directory: .

      - name: Install the workspace
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Build workspace packages and the N-API addon
        run: |
          pnpm -r --filter './packages/**' build
        working-directory: .
      - name: "Build the native runtime archive for ${{ matrix.triple }} (baseline: no Python providers)"
        run: |
          node studio/desktop/fetch-tools.mjs
          python - <<'PY'
          import hashlib, json, os, platform, subprocess, sys, urllib.request
          from pathlib import Path
          root = Path.cwd()
          manifest = root / "renderer/render-core/assets/sky/SOURCES.json"
          pinned = manifest.read_bytes()
          sources = json.loads(pinned)["sources"]
          inputs = root / "renderer/assets-src"
          inputs.mkdir(parents=True, exist_ok=True)
          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          for source in sources:
              target = inputs / source["download"]
              if target.exists() and target.stat().st_size == source["download_bytes"] and digest(target) == source["download_sha256"]:
                  continue
              temporary = target.with_suffix(target.suffix + ".partial")
              size = 0
              with urllib.request.urlopen(source["file_url"], timeout=120) as response, temporary.open("wb") as output:
                  while chunk := response.read(1024 * 1024):
                      size += len(chunk)
                      if size > source["download_bytes"]:
                          raise RuntimeError("NASA source exceeds its pinned length")
                      output.write(chunk)
              if size != source["download_bytes"] or digest(temporary) != source["download_sha256"]:
                  raise RuntimeError("NASA source differs from SOURCES.json")
              temporary.replace(target)
          system = {"Windows": "win32", "Darwin": "darwin", "Linux": "linux"}[platform.system()]
          arch = "arm64" if platform.machine().lower() in ("arm64", "aarch64") else "x64"
          tools = root / "studio/dist/desktop-tools" / f"{system}-{arch}"
          environment = {**os.environ, "PATH": str(tools) + os.pathsep + os.environ["PATH"]}
          subprocess.run([sys.executable, "renderer/tools/prepare_sky_assets.py"], env=environment, check=True)
          for source in sources:
              product = manifest.parent / source["product"]
              if product.stat().st_size != source["product_bytes"] or digest(product) != source["product_sha256"]:
                  raise RuntimeError("Generated sky product differs from its canonical pin")
          # Builds verify the canonical pins; they do not author replacement metadata.
          manifest.write_bytes(pinned)
          PY
          node scripts/native-runtime/package-runtime.mjs --target ${{ matrix.triple }} --no-gpu-interop
        working-directory: .
      - name: Stage the desktop artifact
        env:
          SIMFORGE_DESKTOP_CLOUD_ORIGIN: ${{ inputs.cloud_origin || 'https://staging.simforge.ai' }}
        run: node desktop/stage.mjs

      - name: Decide code signing from the secrets actually present
        id: signing
        env:
          HAS_WIN_CERT: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
          HAS_MAC_CERT: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' }}
          HAS_APPLE_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          case "$RUNNER_OS" in
            Windows) signed="$HAS_WIN_CERT"; notarized=false ;;
            macOS)   signed="$HAS_MAC_CERT"; notarized=$([ "$HAS_MAC_CERT" = true ] && [ "$HAS_APPLE_NOTARY" = true ] && echo true || echo false) ;;
            *)       signed=false; notarized=false ;;
          esac
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "notarized=$notarized" >> "$GITHUB_OUTPUT"
          echo "Signing: $signed, notarization: $notarized"

      - name: Package (unsigned)
        if: steps.signing.outputs.signed != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --config desktop/electron-builder.yml ${{ matrix.targets }} --publish never ${{ runner.os == 'macOS' && '-c.mac.identity=-' || '' }}

      - name: Package and sign (Windows)
        if: steps.signing.outputs.signed == 'true' && runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --config desktop/electron-builder.yml ${{ matrix.targets }} --publish never -c.forceCodeSigning=true

      - name: Package, sign and notarize (macOS)
        if: steps.signing.outputs.signed == 'true' && runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ steps.signing.outputs.notarized == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.signing.outputs.notarized == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.notarized == 'true' && secrets.APPLE_TEAM_ID || '' }}
        # mac.notarize stays false in the config; it is switched on here only with credentials.
        run: pnpm exec electron-builder --config desktop/electron-builder.yml ${{ matrix.targets }} --publish never -c.forceCodeSigning=true ${{ steps.signing.outputs.notarized == 'true' && '-c.mac.notarize=true' || '' }}

      - name: Verify the package (only this leg's target, exact asar contents, complete native payload, pinned encoders modulo signature)
        run: node desktop/verify-package.mjs

      - name: Verify macOS signatures (ad-hoc or Developer ID) and notarization ticket
        if: runner.os == 'macOS'
        # verify-package resolves encoder paths from the stage manifest and
        # verifies their pinned code and signatures. Check the enclosing bundle here.
        run: |
          for app in dist/desktop/out/mac*/"SimForge Studio.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            if [ "${{ steps.signing.outputs.notarized }}" = true ]; then
              spctl --assess --type execute --verbose=2 "$app"
              xcrun stapler validate "$app"
            fi
          done

      - name: Verify Windows Authenticode signature
        if: runner.os == 'Windows' && steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          Get-ChildItem dist/desktop/out/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            if ($sig.Status -ne 'Valid') { throw "$($_.Name): signature status $($sig.Status)" }
            Write-Host "$($_.Name): signed by $($sig.SignerCertificate.Subject)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: simforge-studio-${{ matrix.name }}-${{ steps.signing.outputs.signed == 'true' && (steps.signing.outputs.notarized == 'true' && 'signed-notarized' || 'signed') || 'unsigned' }}
          if-no-files-found: error
          retention-days: 14
          path: |
            studio/dist/desktop/out/*.exe
            studio/dist/desktop/out/*.dmg
            studio/dist/desktop/out/*.zip
            studio/dist/desktop/out/*.AppImage
            studio/dist/desktop/out/*.deb
            studio/dist/desktop/out/*.blockmap
