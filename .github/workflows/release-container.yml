name: release-container
# dist publish job: ghcr.io/simforgeinc/simforge:<version>, built from the
# RELEASED Linux tarball (checksum-verified; never a second compile), then:
# ldd + --help + doctor (lavapipe) in the image, Sigstore keyless signature of
# the digest, SLSA provenance pushed to the registry, a syft CycloneDX SBOM
# (attached to the release and as a signed attestation), and
# container-image.json (the digest) on the release.
#
# Only the exact version tag is pushed here; promote.yml adds :X.Y and :latest
# when the release goes stable. linux/arm64 joins when the repo variable
# SIMFORGE_IMAGE_ARM64 is 'true' (needs qemu binfmt on the runner host).
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: simforge-build
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      IMAGE: ghcr.io/simforgeinc/simforge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Stage the released binaries as the build context
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          platforms=linux/amd64
          targets=(x86_64-unknown-linux-gnu:amd64)
          if [[ "${{ vars.SIMFORGE_IMAGE_ARM64 }}" == true ]]; then
            platforms=linux/amd64,linux/arm64
            targets+=(aarch64-unknown-linux-gnu:arm64)
          fi
          mkdir -p ctx/docker dl
          for pair in "${targets[@]}"; do
            triple="${pair%%:*}"; arch="${pair##*:}"
            archive="simforge-${triple}.tar.xz"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl -p "$archive" -p "$archive.sha256"
            (cd dl && sha256sum -c "$archive.sha256")
            mkdir -p "ctx/bin/$arch"
            tar -xJf "dl/$archive" -C dl
            install -m 0755 "dl/simforge-${triple}/simforge" "ctx/bin/$arch/simforge"
          done
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md ctx/
          cp -R skills ctx/skills
          cp docker/simforge-entrypoint.sh ctx/docker/
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build (local, amd64) and check it runs
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 -f docker/simforge.Dockerfile \
            --build-arg SIMFORGE_VERSION="${{ steps.stage.outputs.version }}" \
            --build-arg SIMFORGE_REVISION="$GITHUB_SHA" -t simforge:candidate ctx
          missing="$(docker run --rm --entrypoint ldd simforge:candidate /usr/local/bin/simforge | grep 'not found' || true)"
          [[ -z "$missing" ]] || { echo "the image lacks libraries the binary links:"; echo "$missing"; exit 1; }
          docker run --rm simforge:candidate --help >/dev/null
          docker run --rm -e SIMFORGE_DEVICE=cpu simforge:candidate doctor | tee doctor.json

      - name: Build and push
        id: push
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --push --platform "${{ steps.stage.outputs.platforms }}" -f docker/simforge.Dockerfile \
            --build-arg SIMFORGE_VERSION="${{ steps.stage.outputs.version }}" \
            --build-arg SIMFORGE_REVISION="$GITHUB_SHA" \
            --provenance=false --sbom=false \
            --metadata-file metadata.json \
            -t "$IMAGE:${{ steps.stage.outputs.version }}" ctx
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the image (Sigstore keyless)
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: simforge-image-${{ steps.stage.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach the SBOM to the image and the release
        shell: bash
        run: |
          set -euo pipefail
          sbom="simforge-image-${{ steps.stage.outputs.version }}.cdx.json"
          cosign attest --yes --type cyclonedx --predicate "$sbom" "$IMAGE@${{ steps.push.outputs.digest }}"
          jq -n --arg image "$IMAGE" --arg digest "${{ steps.push.outputs.digest }}" \
            --arg tag "${{ steps.stage.outputs.version }}" --arg platforms "${{ steps.stage.outputs.platforms }}" \
            '{image: $image, digest: $digest, tag: $tag, platforms: ($platforms | split(","))}' > container-image.json
          for f in container-image.json "$sbom"; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null; done
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            container-image.json container-image.json.sigstore.json "$sbom" "$sbom.sigstore.json"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: simforge-image-${{ steps.stage.outputs.version }}.cdx.json
