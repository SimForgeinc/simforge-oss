<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SimForge editor surface harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101014; color: #e8e8ea; font: 13px system-ui, sans-serif; }
      #shell { display: grid; grid-template-columns: 220px 1fr 220px; height: 100vh; }
      .panel { background: #17171c; padding: 10px; overflow: auto; }
      #viewport { position: relative; }
      #hud { position: fixed; left: 230px; bottom: 8px; background: rgba(0,0,0,.6); padding: 4px 6px; white-space: pre; font-family: monospace; }
    </style>
  </head>
  <body>
    <div id="shell"></div>
    <div id="hud"></div>
    <script type="module" src="./editor.tsx"></script>
  </body>
</html>
