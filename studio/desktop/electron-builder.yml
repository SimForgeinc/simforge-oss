# SimForge Studio desktop packaging: one application, fully local, with the
# native payload for the build host's target. Run from studio/ after
# `node desktop/stage.mjs` (which stages for the current platform/arch):
#   pnpm desktop:dist                                   this platform's targets, never published
#   electron-builder --config desktop/electron-builder.yml --win --x64 --publish never
#   electron-builder --config desktop/electron-builder.yml --mac --arm64 --publish never   (or --x64)
#   electron-builder --config desktop/electron-builder.yml --linux --x64 --publish never
# No target lists an `arch`: electron-builder then packages the architecture
# named on the command line, or the host's when none is named, and a listed
# arch would override the command line (a `--mac --arm64` run with both
# arches listed packages both). A macOS or Windows artifact needs the stage
# produced on that platform (addon, sharp, runtime archive, Electron):
# desktop/after-pack.mjs refuses a stage whose manifest names another
# platform or architecture than the one being packaged. Because afterPack
# runs before signing, the stage's pinned encoders are proven byte-identical
# to desktop/tools.lock.json there; desktop/verify-package.mjs proves the
# signed package afterwards. .github/workflows/desktop.yml runs each matrix
# leg on its native runner with its own `--<arch>`.
#
# Two-package layout: the Electron application is the dependency-free
# directory the stage writes (dist/desktop/app), and the whole local host is
# copied to resources/studio by afterPack from dist/desktop/resources.
#
# Code signing is real or absent, never pretended: electron-builder signs
# Windows builds when CSC_LINK / CSC_KEY_PASSWORD carry a certificate and
# macOS builds when a Developer ID identity is available; the workflow sets
# forceCodeSigning and mac.notarize only when it actually supplies those
# secrets, and labels artifacts unsigned otherwise. User data (database,
# artifacts, map cache, native job state) lives outside the install directory
# and outside anything the installers remove (see resolveDataRoot in
# desktop/main.mjs), so installs, updates and uninstalls never touch it.
appId: ai.simforge.studio
productName: SimForge Studio
copyright: Copyright © SimForge
directories:
  app: dist/desktop/app
  output: dist/desktop/out
  buildResources: desktop/build
npmRebuild: false
nodeGypRebuild: false
asar: true
files:
  - main.mjs
  - cache-preload.cjs
  - starting.html
  - host-exited.html
  - icon.png
  - package.json
  - "!node_modules/**/*"
afterPack: desktop/after-pack.mjs
# Asset names carry no spaces: GitHub rewrites a space in a release asset
# name to a dot, which breaks SHA256SUMS line matching and predictable
# download URLs. The product name in the UI keeps its space (productName
# above); only the file names are hyphenated, and they are hyphenated here at
# source rather than renamed after the fact.
artifactName: "SimForge-Studio-${version}-${os}-${arch}.${ext}"

win:
  target:
    - nsis
  # Native binaries are MSVC builds; the VC++ runtime ships with Windows 10/11 updates
  # and with Electron itself, nothing to install separately.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  shortcutName: SimForge Studio
  artifactName: "SimForge-Studio-Setup-${version}-${arch}.${ext}"

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop/build/entitlements.mac.plist
  entitlementsInherit: desktop/build/entitlements.mac.plist
  # Enabled by the workflow (-c.mac.notarize=true) only with Apple credentials.
  notarize: false
  minimumSystemVersion: "12.0"
  # The local host, runner and render service are separate Mach-O executables
  # in Resources; hardened-runtime signing must cover them (deep signing does).
dmg:
  writeUpdateInfo: false

linux:
  target:
    - dir
    - AppImage
    - deb
  category: Development
  maintainer: SimForge <oss@simforge.ai>
  executableName: simforge-studio
  desktop:
    entry:
      StartupWMClass: simforge-studio
