<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SimCloud</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b0e14; color: #d7dbe3; font: 14px system-ui, sans-serif; }
      main { height: 100%; display: grid; place-items: center; text-align: center; }
      p { margin: 4px 0; color: #8b93a3; }
      code { color: #ffb86b; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <strong>SimCloud could not be reached</strong>
        <p><code id="origin"></code> did not answer: <code id="error">unknown</code>.</p>
        <p>Check the network connection, then choose Help &rsaquo; Reconnect. Downloaded maps stay in the map cache.</p>
      </div>
    </main>
    <script>
      const query = new URLSearchParams(location.search);
      document.getElementById("origin").textContent = query.get("origin") ?? "";
      document.getElementById("error").textContent = query.get("error") ?? "unknown";
    </script>
  </body>
</html>
