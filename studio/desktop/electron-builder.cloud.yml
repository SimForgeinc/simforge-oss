# SimCloud desktop packaging: the shell connected to the hosted product. Run
# from studio/ after `node desktop/stage-cloud.mjs [--origin=…]`:
#   pnpm desktop:cloud:dist              this platform's targets, never published
#   electron-builder --config desktop/electron-builder.cloud.yml --win --x64 --publish never
#   electron-builder --config desktop/electron-builder.cloud.yml --mac --arm64 --x64 --publish never
#
# The application is the dependency-free directory desktop/stage-cloud.mjs
# writes (dist/desktop-cloud/app): shell bundle, sandboxed cache preload,
# static pages, package.json. No extraResources, no local host, no native
# addon or runtime archive, no maps: this package has no platform-specific
# content of its own, which is why Windows and macOS targets belong here and
# not in electron-builder.yml (the Linux-qualified local runtime).
#
# Code signing is real or absent, never pretended: electron-builder signs
# Windows builds when CSC_LINK / CSC_KEY_PASSWORD carry a certificate and
# macOS builds when a Developer ID identity is available; the release workflow
# (.github/workflows/desktop.yml) sets forceCodeSigning and mac.notarize only
# when it actually supplies those secrets, and labels artifacts unsigned
# otherwise. Downloaded maps live outside the install and user-data
# directories (see defaultMapCacheRoot in desktop/main.mjs), so installs,
# updates and uninstalls never remove them.
appId: ai.simforge.simcloud
productName: SimCloud
copyright: Copyright © SimForge
directories:
  app: dist/desktop-cloud/app
  output: dist/desktop-cloud/out
  buildResources: desktop/build
npmRebuild: false
nodeGypRebuild: false
asar: true
files:
  - main.mjs
  - cache-preload.cjs
  - starting.html
  - unreachable.html
  - package.json
  - "!node_modules/**/*"
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  shortcutName: SimCloud
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop/build/entitlements.mac.plist
  entitlementsInherit: desktop/build/entitlements.mac.plist
  # Enabled by the workflow (-c.mac.notarize=true) only with Apple credentials.
  notarize: false
  minimumSystemVersion: "12.0"
dmg:
  writeUpdateInfo: false

linux:
  target:
    - dir
    - AppImage
  category: Development
  maintainer: SimForge <oss@simforge.ai>
  executableName: simcloud
